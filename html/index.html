<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/dc66bde90f.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/master.css" />
    <title>Pet Store</title>
  </head>
  <body>
    <header>
      <div class="main-left-icons">
        <i class="fa-solid fa-paw fa-3x"></i>
      </div>
      <nav class="nav-container">
        <a href="#">HOM</a>
        <a href="#">CATEGORIES</a>
        <a href="#">BLO</a>
        <a href="#">CONTAC</a>
      </nav>
      <div class="main-right-icons">
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="market">
          <i class="fa-solid fa-cart-shopping"></i>
        </div>
        <div class="person">
          <i class="fa-solid fa-user"></i>
        </div>
      </div>
    </header>
    <hr />
    <main>
      <h1>Category</h1>

      <div class="categories-container">
        <div class="category-card">
          <p>Dogs</p>
          <img src="" alt="Dog" />
        </div>

        <div class="category-card">
          <p>Cats</p>
          <img src="" alt="Cat" />
        </div>

        <div class="category-card">
          <p>Fish</p>
          <img src="" alt="Fish" />
        </div>

        <div class="category-card">
          <p>Birds</p>
          <img src="" alt="Bird" />
        </div>

        <div class="category-card">
          <p>Small pets</p>
          <img src="" alt="Small pets" />
        </div>

        <div class="category-card">
          <p>Reptiles</p>
          <img src="" alt="Reptile" />
        </div>

        <div class="category-card">
          <p>Toys</p>
          <img src="" alt="Pet toys" />
        </div>

        <div class="category-card">
          <p>Sale</p>
          <img src="" alt="Sale" />
        </div>
      </div>
    </main>
  </body>
</html>
